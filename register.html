<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр адресов - Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">📝 Регистрация</h3>
                    
                    <form onsubmit="event.preventDefault(); alert('Аккаунт создан! Теперь войдите.'); window.location.href='index.html';">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" placeholder="Придумайте логин" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-control" placeholder="Придумайте пароль" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Подтвердите пароль</label>
                            <input type="password" class="form-control" placeholder="Повторите пароль" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <small>Уже есть аккаунт? <a href="index.html" class="text-decoration-none">Войти</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
