<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр адресов - Статистика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">🏛️ Реестр адресов</span>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">admin</span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">📊 Статистика системы</h2>

        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5>📁 Всего загрузок</h5>
                        <h2 class="display-4">1</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5>📍 Всего адресов</h5>
                        <h2 class="display-4">3</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h5>📈 Адреса по файлам</h5>
            </div>
            <div class="card-body">
                <canvas id="chart" width="400" height="150"></canvas>
            </div>
        </div>

        <div class="mt-3">
            <a href="dashboard.html" class="btn btn-outline-secondary">← Назад</a>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('chart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Загрузка #1'],
                datasets: [{
                    label: 'Количество адресов',
                    data: [3],
                    backgroundColor: ['rgba(54, 162, 235, 0.7)']
                }]
            },
            options: {
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
