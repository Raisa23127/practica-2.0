<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр адресов - Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Синяя шапка -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">🏛️ Реестр адресов</span>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">admin</span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Карточка загрузки -->
        <div class="card">
            <div class="card-body">
                <h3>📁 Загрузка Excel-файла</h3>
                <p class="text-muted">Загрузите файл с адресами для обработки.</p>
                
                <div class="mb-3">
                    <input type="file" id="fileInput" class="form-control" onchange="enableUpload()">
                </div>
                <button id="uploadBtn" class="btn btn-primary" disabled onclick="handleUpload()">Загрузить и обработать</button>
            </div>
        </div>

        <!-- История загрузок -->
        <div class="card mt-4">
            <div class="card-body">
                <h4>📜 История загрузок</h4>
                <ul class="list-group" id="historyList">
                    <li class="list-group-item text-muted">Пока нет загруженных файлов.</li>
                </ul>
            </div>
        </div>

        <!-- Кнопка статистики -->
        <div class="d-grid gap-2 mt-4">
            <a href="stats.html" class="btn btn-info btn-lg text-white">📊 Смотреть статистику</a>
        </div>
    </div>

    <!-- Скрипт для имитации загрузки -->
    <script>
        let fileCount = 0;
        
        function enableUpload() {
            document.getElementById('uploadBtn').disabled = false;
        }

        function handleUpload() {
            fileCount++;
            const now = new Date().toLocaleString();
            const list = document.getElementById('historyList');
            
            // Создаем элемент списка
            const item = document.createElement('li');
            item.className = 'list-group-item d-flex justify-content-between align-items-center';
            item.innerHTML = `
                <div>
                    <strong>Файл_${fileCount}.csv</strong><br>
                    <small class="text-muted">Загружено: ${now}</small>
                </div>
                <span class="badge bg-primary rounded-pill">3 адреса</span>
            `;
            
            list.innerHTML = ''; // Очищаем "пусто"
            list.appendChild(item);
            
            document.getElementById('uploadBtn').disabled = true;
            alert('✅ Файл успешно загружен! Найдено 3 адреса.');
        }
    </script>
</body>
</html>
